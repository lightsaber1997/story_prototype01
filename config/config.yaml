llm:
  engine: "server"       # "phi3", "gpt", "server"

  # 서버 설정
  server:
    url: "http://localhost:8080"
    endpoint_sync: "/chat"        # sync (normal JSON response)
    endpoint_stream: "/chat_stream"  # streaming response
    timeout_sec: 300
    payload_mode: "both"   # "messages" | "prompt" | "both"
    temperature: 0.7
    top_p: 1.0

  # 스트림 설정
  chat_response_streaming:
    enabled: true